kind = "web"
previewPath = "/nhid-audit/"
title = "NHID Audit Core Dashboard"
version = "1.0.0"
id = "artifacts/nhid-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/nhid-audit/" ]
localPort = 20027

[services.development]
run = "pnpm --filter @workspace/nhid-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nhid-dashboard", "run", "build" ]
publicDir = "artifacts/nhid-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20027"
BASE_PATH = "/nhid-audit/"
