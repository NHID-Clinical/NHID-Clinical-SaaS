kind = "web"
previewPath = "/nhid-saas/"
title = "NHID Clinical SaaS Dashboard"
version = "1.0.0"
id = "artifacts/nhid-saas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

# ── React frontend ─────────────────────────────────────────────────────────────
[[services]]
name = "web"
paths = [ "/nhid-saas/" ]
localPort = 23223

[services.development]
run = "pnpm --filter @workspace/nhid-saas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nhid-saas", "run", "build" ]
publicDir = "artifacts/nhid-saas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23223"
BASE_PATH = "/nhid-saas/"

# ── SaaS Gateway (Python / FastAPI) ───────────────────────────────────────────
# Port 8010 is managed by the "NHID Clinical SaaS" workflow in development.
# In production, the run block starts the gateway directly.
# "/" is owned here so the root redirects to /nhid-saas/ — NHID Audit Core
# Dashboard is NOT exposed at the root in production.
[[services]]
name = "SaaS Gateway"
paths = [ "/", "/saas/", "/saas-api/", "/admin/", "/health" ]
localPort = 8010

[services.development]
run = "sleep infinity"

[services.production.run]
args = [ "python", "nhid-clinical/saas_main.py" ]

[services.production.run.env]
PORT = "8010"

[services.production.health.startup]
path = "/health"
