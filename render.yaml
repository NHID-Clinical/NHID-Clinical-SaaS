# Render blueprint for the NHID-Clinical SaaS MVP.
#
# Two services: the FastAPI backend and the static frontend. The database is
# NOT declared here -- it is a managed Postgres you create separately (Supabase
# or Render Postgres) and whose connection string you paste into DATABASE_URL.
# Declaring it here would put its lifecycle under this file, and a blueprint
# edit should never be able to destroy the database.
#
# Applying it asks for exactly two values (DATABASE_URL and ADMIN_PASS);
# everything else is fixed here or generated by Render. Secrets are entered in
# the dashboard and never committed to this repository.
#
# Apply with: Render Dashboard -> New -> Blueprint -> point at this repo.
# See docs/DEPLOYMENT.md for the full procedure, including what to set and
# in what order.

services:
  # ── API ────────────────────────────────────────────────────────────────────
  - type: web
    name: nhid-clinical-api
    runtime: python
    plan: starter          # free instances sleep, and a sleeping API looks broken
    rootDir: nhid-clinical
    buildCommand: pip install -r requirements.txt
    # Migrations run as a release step, before any worker starts, so the schema
    # is settled exactly once rather than raced by every booting worker.
    preDeployCommand: python scripts/migrate.py
    startCommand: uvicorn saas_main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Schema is applied by preDeployCommand above, so workers must not also
      # issue DDL on import. See saas_layer/migrations.py.
      - key: NHID_SKIP_SCHEMA_BOOTSTRAP
        value: "1"
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11"

      # --- the only two values you are asked for when applying this blueprint ---
      - key: DATABASE_URL          # Supabase connection string (pooled, port 6543, sslmode=require)
        sync: false
      - key: ADMIN_PASS            # your admin password (12+ characters). Swap for ADMIN_PASS_HASH later.
        sync: false

      # --- filled in automatically ---
      - key: HMAC_SECRET           # signs the audit chain; Render generates a random value once
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS  # the frontend's host below; the gateway adds https://
        fromService:
          type: web
          name: nhid-clinical-app
          property: host

      # Email sign-in starts OFF so a first deploy needs no sending domain: the
      # administrator signs in at /admin with a password, organizations use
      # their API key, and /saas/auth/request-link answers 503 saying so. To
      # turn it on later, change this to `resend` and add, in the dashboard:
      #   EMAIL_API_KEY, EMAIL_FROM (an address on a verified domain),
      #   APP_BASE_URL (the frontend origin) and, if app and API sit on
      #   different subdomains of one domain, SESSION_COOKIE_DOMAIN.
      # Billing likewise needs STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY and
      # STRIPE_WEBHOOK_SECRET, added in the dashboard when billing is switched on.
      - key: EMAIL_BACKEND
        value: disabled

  # ── Frontend ───────────────────────────────────────────────────────────────
  - type: web
    name: nhid-clinical-app
    runtime: static
    # Built from the repository root with pnpm: the app depends on workspace
    # packages ("workspace:*") and the pnpm catalog ("catalog:"), which npm
    # cannot resolve -- `npm install` inside artifacts/nhid-saas fails.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm -C artifacts/nhid-saas run build
    staticPublishPath: artifacts/nhid-saas/dist/public
    envVars:
      # Vite requires both at build time and fails the build without them.
      # BASE_PATH is "/" here because this is a site root, not a project subpath
      # the way GitHub Pages is.
      - key: PORT
        value: "3000"
      - key: BASE_PATH
        value: /
      # The API's host, inlined into the bundle at build time; the app adds
      # https://. Not a secret -- every visitor's browser can see it.
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: nhid-clinical-api
          property: host
    routes:
      # The app is a single-page application: every unknown path must return
      # index.html so client-side routing survives a reload or a deep link.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
