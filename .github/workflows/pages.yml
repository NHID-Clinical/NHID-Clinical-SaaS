name: Pages

# Publishes the Governance Ops dashboard to GitHub Pages.
#
# This is the deployment path. The project does not deploy to Vercel, and the
# vercel.json that used to sit in artifacts/nhid-saas has been removed rather
# than kept as configuration for a provider nothing publishes through.
#
# THE REPOSITORY SETTING MATTERS. Settings -> Pages -> Build and deployment ->
# Source must be "GitHub Actions". When it is "Deploy from a branch", GitHub
# also runs its own "pages build and deployment" (Jekyll) on every push, which
# publishes the raw repository -- README.md rendered as the home page -- and
# whichever of the two finishes last is what the site serves. Both report
# success, so the failure is silent: deploys "succeed" and the app does not
# appear. On 2026-10-18 the live site was confirmed to be the Jekyll README
# (generator: Jekyll v3.10.0), which disproved an earlier version of this
# comment that called the source already GitHub Actions.
#
# Two defences while that setting is wrong:
#   * `page_build` below re-runs this workflow after each GitHub branch build
#     finishes, so the app is always published last and wins the race (with a
#     rate cap so the trigger can never loop);
#   * the "Check Pages source" step reports the misconfiguration on every run.

# What gets published is the recorded demonstration: with no backend reachable
# from Pages, the Ops screens replay output the real evaluator produced
# (nhid-clinical/scripts/build_demo_fixture.py), and every screen says so.

on:
  push:
    branches: ["main"]
  # Fires when GitHub's own branch-based Pages build completes. Only happens
  # while the Pages source is "Deploy from a branch"; republishing then puts
  # the app back over the README that build just published.
  page_build:
  workflow_dispatch:

# Pages needs these; nothing here writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # the page_build gate counts recent runs

# Never let two publishes race; let a newer commit supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Only for page_build. Every page_build event republishes -- the app must be
  # the last thing published after each branch build, including when two
  # commits land close together. Deduplicating by commit is wrong here:
  # GitHub sets GITHUB_SHA on page_build to the branch's current head, not to
  # the commit that was built, so a second event would see the first
  # republish and skip, letting the README win.
  #
  # What this does cap is a loop. If GitHub ever emitted page_build for this
  # workflow's own deploy, the trigger would feed itself; three page_build
  # republishes inside ten minutes is far beyond any real merge rate, so the
  # fourth stops.
  gate:
    name: Republish unless looping
    if: github.event_name == 'page_build'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/pages.yml/runs?event=page_build&created=%3E%3D${since}&per_page=100" \
                --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length')
          if [ "${n:-0}" -ge 3 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=page_build republish capped::${n} page_build runs in the last 10 minutes; not republishing again."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the dashboard
    needs: gate
    if: always() && (needs.gate.result == 'skipped' || needs.gate.outputs.proceed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain pinned to match ci.yml exactly. A Pages build that resolves
      # different dependencies than CI would make a green CI meaningless here.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # BASE_PATH is the project-page subpath, and it is load-bearing: vite
        # uses it as `base`, and App.tsx feeds the same value to wouter via
        # import.meta.env.BASE_URL. Build at "/" and every asset 404s, the
        # server returns index.html instead, and the browser refuses it for the
        # wrong MIME type -- the classic blank deploy.
        env:
          PORT: "3000"
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm -C artifacts/nhid-saas run build

      - name: Add SPA fallback
        # GitHub Pages serves static files and has no rewrite rule, so a deep
        # link like /ops/findings would 404 on reload. Pages serves 404.html for
        # any unmatched path, so a copy of index.html there hands routing back
        # to wouter.
        run: cp artifacts/nhid-saas/dist/public/index.html artifacts/nhid-saas/dist/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/nhid-saas/dist/public

  deploy:
    name: Publish
    needs: build
    # Explicit, because the default success() would skip this job whenever the
    # gate upstream of build was skipped -- i.e. on every ordinary push.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Check Pages source
        # Reports, without failing the deploy, when the repository is still set
        # to "Deploy from a branch" -- the setting that lets the README overwrite
        # the app (see the header comment).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          if [ "$src" != "workflow" ]; then
            msg="GitHub Pages source is '$src', not 'GitHub Actions'. GitHub's own branch build will keep overwriting the app with README.md. Fix: Settings -> Pages -> Build and deployment -> Source -> GitHub Actions."
            echo "::warning title=Pages source is not GitHub Actions::$msg"
            echo "### Pages source needs changing" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pages source is GitHub Actions."
          fi
