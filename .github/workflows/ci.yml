name: CI

# Runs on every pull request into main, and on main itself. Before this
# workflow existed the repository had no PR gate at all: the only
# pull_request-triggered job was a Jekyll template that did not apply to this
# monorepo, which is how a TypeScript build break reached main unnoticed.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — tests, startup and config validation
    runs-on: ubuntu-latest

    # The gateway reads DATABASE_URL at import time, so the suite needs a real
    # database rather than a connection string. Without this service
    # tests/test_voice_enforcement.py (77 tests) errors during collection.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nhid_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nhid_ci
      # CI-only values. Real secrets are never needed to run the suite, and
      # these must never be reused anywhere else.
      HMAC_SECRET: ci-only-hmac-secret-not-for-any-deployment
      ADMIN_PASS: ci-only-admin-password-not-for-any-deployment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: nhid-clinical
        run: pip install -r requirements.txt

      - name: Apply migrations to a fresh database
        working-directory: nhid-clinical
        # This is the exact command render.yaml runs as its preDeployCommand.
        #
        # It must come BEFORE any step that imports saas_layer.gateway, because
        # importing it runs ensure_schema() and applies the baseline. Placed
        # after check_startup.py, this step found the schema already built and
        # reported "up to date" -- so it exercised the CLI's read paths and
        # never once applied a migration, which is exactly the thing worth
        # testing. The grep below asserts that it really applied, so the step
        # fails loudly if the ordering regresses rather than quietly going
        # back to proving nothing.
        #
        # The grep counts nothing in particular on purpose. Pinning it to an
        # exact number means every new migration has to remember to bump it,
        # and the failure mode of forgetting is a red build that looks like a
        # migration bug -- or worse, someone "fixing" it by loosening the
        # check. What matters is that at least one was applied.
        run: |
          python scripts/migrate.py | tee /tmp/migrate.out
          grep -qE "Applied [0-9]+ migration" /tmp/migrate.out || {
            echo "::error::migrate.py applied nothing — the schema already existed, so this step is not testing a fresh-database migration. Check the step ordering."
            exit 1
          }
          python scripts/migrate.py --check   # must now report nothing pending
          python scripts/migrate.py --status

      - name: Validate required configuration and module imports
        working-directory: nhid-clinical
        # Prints variable names and a present/absent verdict only — never values.
        run: python scripts/check_startup.py

      - name: Refuse to start without an admin credential
        working-directory: nhid-clinical
        # Regression guard for the removed fail-open default: with no admin
        # credential configured, the startup check must fail.
        run: |
          if env -u ADMIN_PASS -u ADMIN_PASS_HASH python scripts/check_startup.py; then
            echo "::error::Startup check passed without an admin credential — the fail-open default may have been reintroduced."
            exit 1
          fi
          echo "Confirmed: startup is refused when no admin credential is set."

      - name: Refuse to start in production without CORS origins
        working-directory: nhid-clinical
        # Regression guard: a production deployment with no allowed origins is
        # either broken or wide open, so startup must abort rather than choose.
        run: |
          if APP_ENV=production CORS_ALLOWED_ORIGINS= python -c "
          import saas_layer.gateway as g
          import asyncio
          asyncio.run(g._lifespan(g.app).__aenter__())
          "; then
            echo "::error::Startup succeeded in production with no CORS_ALLOWED_ORIGINS."
            exit 1
          fi
          echo "Confirmed: production startup is refused without CORS_ALLOWED_ORIGINS."

      - name: Refuse to start in production without an email sender
        working-directory: nhid-clinical
        # Regression guard, same class as the two above. A production
        # deployment that cannot send mail accepts every sign-in request,
        # answers 202, delivers nothing, and locks every user out with no
        # error anywhere -- so it must abort rather than look healthy.
        #
        # CORS_ALLOWED_ORIGINS is set here so that the CORS check passes and
        # this step is actually exercising the email check rather than
        # re-testing the previous one.
        run: |
          if APP_ENV=production CORS_ALLOWED_ORIGINS=https://example.org EMAIL_BACKEND= python -c "
          import saas_layer.gateway as g
          import asyncio
          asyncio.run(g._lifespan(g.app).__aenter__())
          "; then
            echo "::error::Startup succeeded in production with no email sender configured. Sign-in links would go nowhere."
            exit 1
          fi
          echo "Confirmed: production startup is refused without an email sender."

      - name: Run tests
        working-directory: nhid-clinical
        run: python -m pytest tests/ -q

  typescript:
    name: TypeScript — typecheck, tests and frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # The repository pins no packageManager; lockfileVersion 9.0 requires
          # pnpm 9 or newer. Pinned here so local, CI and deploy agree.
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile fails the build if pnpm-lock.yaml is out of date
        # rather than silently resolving something different.
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm -C artifacts/nhid-clinical-operations run test

      - name: Build customer frontend
        # PORT and BASE_PATH are required by vite.config.ts. BASE_PATH is "/"
        # here because this step only checks that the app compiles; the
        # published build sets the project-page subpath in pages.yml.
        env:
          PORT: "3000"
          BASE_PATH: /
        run: pnpm -C artifacts/nhid-saas run build
