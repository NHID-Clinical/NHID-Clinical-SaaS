t><path d="M671 602 H697" stroke="#33456B" stroke-width="1.3" stroke-dasharray="1 5" stroke-linecap="round"/><text x="707" y="598" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700" fill="#D4A94C" letter-spacing="2.4">LAYER 2</text><text x="707" y="621" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19.5" font-weight="700" fill="#2DD4BF">NHID-Clinical v1.3</text><text x="707" y="642" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8FA6C4">Behavioral disclosure baseline · IDG · PDX · DBC · EIT · ATR</text><path d="M671 484 H697" stroke="#33456B" stroke-width="1.3" stroke-dasharray="1 5" stroke-linecap="round"/><text x="707" y="480" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700" fill="#6E87AB" letter-spacing="2.4">LAYER 3</text><text x="707" y="503" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19.5" font-weight="700" fill="#C7D5E8">NHID-Auth v2</text><text x="707" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8FA6C4">Cryptographic delegated authority · Ed25519 passports</text><path d="M671 366 H697" stroke="#33456B" stroke-width="1.3" stroke-dasharray="1 5" stroke-linecap="round"/><text x="707" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700" fill="#6E87AB" letter-spacing="2.4">LAYER 4</text><text x="707" y="385" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19.5" font-weight="700" fill="#C7D5E8">FHIR AuditEvent R4</text><text x="707" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8FA6C4">Healthcare-native audit logging</text><path d="M671 248 H697" stroke="#33456B" stroke-width="1.3" stroke-dasharray="1 5" stroke-linecap="round"/><text x="707" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700" fill="#6E87AB" letter-spacing="2.4">LAYER 5</text><text x="707" y="267" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19.5" font-weight="700" fill="#C7D5E8">OpenTelemetry</text><text x="707" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8FA6C4">Enterprise observability</text>
  <text x="48" y="924" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-style="italic" fill="#5A7292">Illustrative 3D visualization of the five-layer trust stack — conceptual render for clarity. Open voluntary proposal · not a certification.</text>
