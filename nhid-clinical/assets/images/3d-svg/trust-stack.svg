  <text x="48" y="92" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14.5" fill="#8FA6C4">Where NHID-Clinical sits: a behavioral baseline layered between carrier authentication and cryptographic authorization.</text>
