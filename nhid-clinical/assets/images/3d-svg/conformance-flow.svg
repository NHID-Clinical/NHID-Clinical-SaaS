  <text x="48" y="64" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="27" font-weight="700" fill="#C7D5E8" letter-spacing="0.2">Conformance Flow</text>
  <text x="48" y="92" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14.5" fill="#8FA6C4">How a live vendor call becomes a scored, auditable conformance verdict.</text>
  <g filter="url(#nGlow)"><rect x="40" y="234" width="182" height="96" rx="12" fill="url(#node)" stroke="#1e2a44" stroke-width="1.6"/><path d="M54 235.5 H208" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/></g><text x="131.0" y="266" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16.5" font-weight="700" fill="#C7D5E8">Vendor call event</text><text x="131.0" y="287" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">Vapi · Retell · Bland · Connect</text><text x="131" y="314" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="12.5" fill="#38BDF8">{ session.json }</text><path d="M222 282 L324 282" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arr)" fill="none" stroke-opacity="0.85"/><text x="273.0" y="271.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#7C93B4">POST /v1/…</text><g filter="url(#nGlow)"><rect x="324" y="234" width="158" height="96" rx="12" fill="url(#node)" stroke="#1e2a44" stroke-width="1.6"/><path d="M338 235.5 H468" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/></g><text x="403.0" y="266" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16.5" font-weight="700" fill="#C7D5E8">Adapter</text><text x="403.0" y="287" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">normalize to NHID events</text><path d="M482 282 L584 282" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arr)" fill="none" stroke-opacity="0.85"/><text x="533.0" y="271.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#7C93B4">trace events</text><g filter="url(#nGlowT)"><rect x="584" y="192" width="286" height="180" rx="12" fill="url(#nodeHero)" stroke="#14B8A6" stroke-width="1.6"/><path d="M598 193.5 H856" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/></g><text x="727.0" y="224" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16.5" font-weight="700" fill="#2DD4BF">Policy Engine</text><text x="727.0" y="245" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">deterministic · 18-case conformance suite</text><rect x="593.5" y="278" width="49" height="26" rx="7" fill="#0F172A" stroke="#14B8A6" stroke-width="1.1"/><text x="618.0" y="295" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="9.5" fill="#2DD4BF">IDG-01</text><rect x="648.0" y="278" width="49" height="26" rx="7" fill="#0F172A" stroke="#14B8A6" stroke-width="1.1"/><text x="672.5" y="295" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="9.5" fill="#2DD4BF">PDX-01</text><rect x="702.5" y="278" width="49" height="26" rx="7" fill="#0F172A" stroke="#14B8A6" stroke-width="1.1"/><text x="727.0" y="295" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="9.5" fill="#2DD4BF">DBC-01</text><rect x="757.0" y="278" width="49" height="26" rx="7" fill="#0F172A" stroke="#14B8A6" stroke-width="1.1"/><text x="781.5" y="295" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="9.5" fill="#2DD4BF">EIT-01</text><rect x="811.5" y="278" width="49" height="26" rx="7" fill="#0F172A" stroke="#14B8A6" stroke-width="1.1"/><text x="836.0" y="295" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="9.5" fill="#2DD4BF">ATR-01</text><text x="727.0" y="334" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">five controls evaluated per session</text><text x="727.0" y="354" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">no PHI stored — behavior only</text><path d="M870 282 L972 282" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arr)" fill="none" stroke-opacity="0.85"/><text x="921.0" y="271.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#7C93B4">score</text><g filter="url(#nGlow)"><rect x="972" y="234" width="122" height="96" rx="12" fill="url(#node)" stroke="#1e2a44" stroke-width="1.6"/><path d="M986 235.5 H1080" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/></g><text x="1033.0" y="266" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16.5" font-weight="700" fill="#C7D5E8">CAS</text><text x="1033.0" y="287" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">0.0 – 1.0 per call</text><text x="1033" y="314" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="15" font-weight="700" fill="#D4A94C">0.92</text><path d="M1094 270 L1150 224" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arr)" fill="none" stroke-opacity="0.85"/><path d="M1094 294 L1150 344" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arr)" fill="none" stroke-opacity="0.85"/><g filter="url(#nGlow)"><rect x="1150" y="174" width="122" height="78" rx="12" fill="url(#node)" stroke="#1e2a44" stroke-width="1.6"/><path d="M1164 175.5 H1258" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/></g><text x="1211.0" y="206" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16.5" font-weight="700" fill="#C7D5E8">Verdict</text><text x="1211.0" y="227" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">pass · fail · flags</text><g filter="url(#nGlow)"><rect x="1150" y="312" width="122" height="78" rx="12" fill="url(#node)" stroke="#1e2a44" stroke-width="1.6"/><path d="M1164 313.5 H1258" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/></g><text x="1211.0" y="344" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16.5" font-weight="700" fill="#C7D5E8">Audit trace</text><text x="1211.0" y="365" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">FHIR AuditEvent R4</text><rect x="40" y="492" width="1200" height="52" rx="10" fill="#131F38" stroke="#1e2a44" stroke-width="1.5"/><text x="66" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#8FA6C4"><tspan fill="#2DD4BF" font-weight="700">Every session produces a machine-readable, tamper-evident trace.</tspan>  Same payload in — same verdict out. Rerun any call, byte-for-byte, months later.</text>
  <text x="48" y="634" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-style="italic" fill="#5A7292">Illustrative architecture visualization of the conformance flow — conceptual render for clarity. Demo endpoints are open; no PHI is processed.</text>
</svg>
