<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="730" viewBox="0 0 1180 730" role="img" aria-label="Impersonation Latency">
  <defs>
    <radialGradient id="pbg" cx="0.5" cy="0.12" r="1.15">
      <stop offset="0" stop-color="#16233E"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <linearGradient id="ptop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hazard" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7F1D1D"/><stop offset="1" stop-color="#B4552D"/></linearGradient><linearGradient id="safe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F766E"/><stop offset="1" stop-color="#14B8A6"/></linearGradient><pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="none"/><line x1="0" y1="0" x2="0" y2="9" stroke="rgba(255,255,255,0.16)" stroke-width="3"/></pattern><filter id="barGlow" x="-30%" y="-80%" width="160%" height="260%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect x="1" y="1" width="1178" height="728" rx="14" fill="url(#pbg)" stroke="#1e2a44" stroke-width="2"/>
  <rect x="120" y="1.5" width="940" height="2" fill="url(#ptop)"/>
  <text x="48" y="64" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="27" font-weight="700" fill="#C7D5E8" letter-spacing="0.2">Impersonation Latency</text>
  <text x="48" y="92" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14.5" fill="#8FA6C4">The window between an AI agent connecting and disclosing it is not human — the core failure NHID-Clinical measures and closes.</text>
  <text x="150" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#F1A08A">WITHOUT DISCLOSURE BASELINE</text><g filter="url(#barGlow)"><rect x="150" y="253" width="720" height="30" rx="15" fill="url(#hazard)"/><rect x="150" y="253" width="720" height="30" rx="15" fill="url(#hatch)"/><rect x="151.2" y="254.5" width="717" height="12" rx="6" fill="rgba(255,255,255,0.14)"/><rect x="880" y="253" width="180" height="30" rx="15" fill="#334155"/></g><line x1="164" y1="244" x2="164" y2="268" stroke="#C7D5E8" stroke-width="2"/><circle cx="164" cy="268" r="5.5" fill="#C7D5E8" stroke="#0F172A" stroke-width="2"/><text x="164" y="228" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="600" fill="#C7D5E8">Call connects</text><text x="164" y="245" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">sounds human</text><line x1="400" y1="292" x2="400" y2="268" stroke="#F1A08A" stroke-width="2"/><circle cx="400" cy="268" r="5.5" fill="#F1A08A" stroke="#0F172A" stroke-width="2"/><text x="400" y="326" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="600" fill="#F1A08A">Credentials accepted</text><text x="400" y="343" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">public-registry NPI</text><line x1="630" y1="244" x2="630" y2="268" stroke="#F87171" stroke-width="2"/><circle cx="630" cy="268" r="5.5" fill="#F87171" stroke="#0F172A" stroke-width="2"/><text x="630" y="228" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="600" fill="#F87171">PHI exchanged</text><text x="630" y="245" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">claims · eligibility detail</text><line x1="870" y1="292" x2="870" y2="268" stroke="#FCA5A5" stroke-width="2"/><circle cx="870" cy="268" r="5.5" fill="#FCA5A5" stroke="#0F172A" stroke-width="2"/><text x="870" y="326" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">“Are you a person?”</text><text x="870" y="343" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">disclosure only when challenged</text><path d="M164 198 v-12 h706 v12" fill="none" stroke="#D4A94C" stroke-width="1.8"/><text x="517.0" y="176" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#D4A94C">IMPERSONATION LATENCY — minutes, PHI exposed the whole time</text><text x="150" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#2DD4BF">WITH NHID-CLINICAL v1.3</text><g filter="url(#barGlow)"><rect x="150" y="485" width="64" height="30" rx="15" fill="#475569"/><rect x="222" y="485" width="838" height="30" rx="15" fill="url(#safe)"/><rect x="223.2" y="486.5" width="835" height="12" rx="6" fill="rgba(255,255,255,0.16)"/></g><line x1="240" y1="476" x2="240" y2="500" stroke="#2DD4BF" stroke-width="2"/><circle cx="240" cy="500" r="5.5" fill="#2DD4BF" stroke="#0F172A" stroke-width="2"/><text x="240" y="460" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="700" fill="#2DD4BF">Discloses non-human identity</text><text x="240" y="477" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">IDG-01 · before any PHI</text><line x1="620" y1="476" x2="620" y2="500" stroke="#5EEAD4" stroke-width="2"/><circle cx="620" cy="500" r="5.5" fill="#5EEAD4" stroke="#0F172A" stroke-width="2"/><text x="620" y="460" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="600" fill="#5EEAD4">Verified exchange</text><text x="620" y="477" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">PDX-01 · scoped data only</text><line x1="1000" y1="524" x2="1000" y2="500" stroke="#38BDF8" stroke-width="2"/><circle cx="1000" cy="500" r="5.5" fill="#38BDF8" stroke="#0F172A" stroke-width="2"/><text x="1000" y="558" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="600" fill="#38BDF8">Tamper-evident trace</text><text x="1000" y="575" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8FA6C4">ATR-01 · CAS scored</text><path d="M158 524 v10 h62 v-10" fill="none" stroke="#2DD4BF" stroke-width="1.8"/><text x="154" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14.5" font-weight="700" fill="#2DD4BF">IL ≈ 0 — disclosed on the first conversational turn</text><rect x="150" y="616" width="440" height="46" rx="10" fill="#131F38" stroke="#1e2a44" stroke-width="1.5"/><text x="172" y="645" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="16.5" fill="#D4A94C">IL = t(disclosure) − t(connect)</text><text x="610" y="645" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8FA6C4">Both anchors are required ATR-01 trace fields — deterministic, auditable.</text>
  <text x="48" y="704" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-style="italic" fill="#5A7292">Illustrative timeline visualization of impersonation latency — conceptual render for clarity, not measured incident data.</text>
</svg>
